name: Build BitChord Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - bitchord-concert-port
    paths:
      - 'BitChord-1.10/**'
      - '.github/workflows/build-bitchord-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: BitChord-1.10
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Android-APK
          path: BitChord-1.10/app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
          retention-days: 7
